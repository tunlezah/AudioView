# /run/lpframe — the IPC socket and the artwork tmpfs (DESIGN §5.3).
#
# `lpframe-artd.service` also declares `RuntimeDirectory=lpframe`, which is
# not redundant with this: RuntimeDirectory guarantees the ownership and mode
# whatever else has happened, and this guarantees the directory exists before
# either service starts, including on a boot where artd fails and lprender
# comes up anyway.
#
# The pairing that matters is `RuntimeDirectoryPreserve=yes` in the unit.
# Without it systemd removes this directory every time artd stops, and
# lprender — which bind-mounts it into its namespace to get write access
# under ProtectSystem=strict — is left holding an unlinked inode and never
# sees the socket again. See systemd/README.md.
d /run/lpframe     0750 lpframe lpframe -
d /run/lpframe/art 0750 lpframe lpframe -

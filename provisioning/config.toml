# LP Frame — device configuration
#
# This file is owned by the package and is read-only on a device with an
# overlayfs root. Changes made from the web interface are written to
# /var/lib/lpframe/config.local.toml and take precedence per key.
#
# Durations are written with a unit: "600ms", "15s", "10m", "2h".
# Settings that can be disabled also accept "off".

[device]
name = "LP Frame"                        # advertised AirPlay name
metadata_pipe = "/tmp/shairport-sync-metadata"

[audio]
alsa_device = "default"                  # e.g. "hw:CARD=KA11,DEV=0"
mixer = ""                               # "" disables hardware volume

[display]
connector = "auto"                       # or "HDMI-A-1", "DSI-1"
mode = "auto"                            # auto | highest | "1920x1920@60"
rotation = 0                             # 0 | 90 | 180 | 270
card = "auto"
margin_percent = 0.0                     # inset, for TVs that overscan

[render]
square = true                            # false fills the panel instead
fit = "cover"                            # cover | contain
background = "blur"                      # black | blur | dominant | gradient
background_dim = 0.35                    # only visible on non-1:1 panels
crossfade = "600ms"
enrichment_crossfade = "250ms"           # shorter: same art, just sharper
ken_burns = false                        # forces continuous rendering
ken_burns_period = "180s"
ambient = false                          # blurred screensaver while idle
ambient_dim = 0.12
placeholder = "/usr/share/lpframe/placeholder.png"

[enrichment]
# Enrichment sends the artist and album name to the configured services.
# Turning it off leaves the device fully functional, just softer-looking.
enabled = true
strictness = "text_and_visual"           # off | text_only | text_and_visual | strict
sources = ["itunes"]                     # add "musicbrainz" only with a contact set
itunes_country = "GB"
max_dimension = 3000
contact = ""                             # REQUIRED by MusicBrainz; an email address
rate_limit_per_min = 15                  # iTunes fair use is around 20

[cache]
dir = "/var/lib/lpframe/cache"
max_bytes = "2GiB"
negative_ttl = "168h"

[power.amp]
# The optocoupler input needs an external pull-down (pull-up if active_low)
# holding it in the amplifier-off state. artd drives the line off on SIGTERM,
# but nothing runs on SIGKILL or a power cut — see systemd/README.md.
enabled = true
gpio_chip = "auto"                       # or a label: pinctrl-rp1, pinctrl-bcm2835
gpio_line = 17
active_low = false
pulse = "0ms"                            # >0 emits a momentary pulse instead
on_event = "session_begin"               # abeg: one transition per listening session
off_delay = "10m"
debounce = "2s"

[power.display]
blank_after = "5m"
ambient_after = "off"                    # or e.g. "30s"
fade_out = "1000ms"

[timeouts]
stall = "15s"                            # playing, no pipe activity -> paused
session = "60s"                          # any session state, no activity -> idle

[ipc]
socket = "/run/lpframe/artd.sock"
art_dir = "/run/lpframe/art"
art_retain = 4

[web]
# Plain HTTP on the local network. This protects against other people and
# devices on your network casually reaching the page; it does NOT protect
# against anyone who can capture traffic on it, because the password crosses
# in the clear. For that, bind to 127.0.0.1 and use an SSH tunnel, or front
# this with a TLS-terminating reverse proxy. Do not port-forward it.
enabled = true
bind = "0.0.0.0:8730"                    # "127.0.0.1:8730" for this device only
auth = true                              # password generated on first start
# password_hash is written here's sibling, config.local.toml, on first start.
# Only the Argon2id hash is stored; the plaintext goes to
# /var/lib/lpframe/web-password.txt (0600) and the startup log, once.
mdns = true                              # adds an _http._tcp record via Avahi
# Permits a non-loopback bind with auth = false. Only for a device behind
# something else that authenticates. artd warns loudly at every startup.
insecure_no_auth = false

[logging]
level = "info"
event_buffer = 200

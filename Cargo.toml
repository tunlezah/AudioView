[workspace]
resolver = "2"
members = ["crates/spmeta", "crates/lpcapture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/tunlezah/AudioView"

[workspace.dependencies]
spmeta = { path = "crates/spmeta" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[workspace]
resolver = "2"
members = [
    "crates/spmeta",
    "crates/lpcapture",
    "crates/lpframe-proto",
    "crates/lpframe-config",
    "crates/artd",
    "crates/lpctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/tunlezah/AudioView"

[workspace.dependencies]
spmeta = { path = "crates/spmeta" }
lpframe-proto = { path = "crates/lpframe-proto" }
lpframe-config = { path = "crates/lpframe-config" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
futures-core = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

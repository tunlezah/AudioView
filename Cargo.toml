[workspace]
resolver = "2"
members = [
    "crates/spmeta",
    "crates/lpcapture",
    "crates/lpframe-proto",
    "crates/lpframe-config",
    "crates/lpframe-image",
    "crates/artd",
    "crates/lpctl",
    "crates/lprender",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/tunlezah/AudioView"

[workspace.dependencies]
spmeta = { path = "crates/spmeta" }
lpframe-proto = { path = "crates/lpframe-proto" }
lpframe-config = { path = "crates/lpframe-config" }
lpframe-image = { path = "crates/lpframe-image" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
futures-core = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }
glow = "0.16"
khronos-egl = { version = "6", features = ["static"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# rustls rather than the system OpenSSL: one fewer thing to cross-compile for
# aarch64, and the device has no certificate store worth reusing.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
drm = "0.14"
gbm = "0.18"
sdl2 = { version = "0.37", default-features = false }
# libgpiod v2 character-device GPIO, pure Rust: no C library to cross-compile.
gpiocdev = "0.8"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

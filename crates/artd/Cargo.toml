[package]
name = "artd"
description = "LP Frame metadata, artwork and power daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lpframe-config.workspace = true
lpframe-proto.workspace = true
spmeta.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
lpcapture = { path = "../lpcapture" }
# For tests/renderer.rs, which drives the real renderer against a real
# daemon. Only the headless EGL backend is wanted; DRM and SDL2 would drag
# in libraries this crate has no other reason to link.
lprender = { path = "../lprender", default-features = false }
